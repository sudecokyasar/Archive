<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arşiv — Akıllı Dosyalama Asistanı</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6faf2;--bg2:#e3eedb;--ink:#22321f;--mut:#5f715a;--acc:#a6dc86;--card:#fff;--line:#cfdec5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17211a;--bg2:#101812;--ink:#e9f2e4;--mut:#9db296;--acc:#8fd07a;--card:#212e24;--line:#2f4033}}
:root[data-theme=dark]{--bg:#17211a;--bg2:#101812;--ink:#e9f2e4;--mut:#9db296;--acc:#8fd07a;--card:#212e24;--line:#2f4033}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg) radial-gradient(var(--line) 1.2px,transparent 1.5px) 0 0/22px 22px;color:var(--ink);font:15px/1.5 'Nunito',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:12px 16px 6px}
.br b{font:400 30px 'Caveat',Georgia,serif}.br small{color:var(--mut);margin-left:8px}
nav{display:flex;gap:2px;background:var(--bg2);padding:4px;border-radius:14px;overflow-x:auto;max-width:100%}
nav button{border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);color:#12100a}
.btn{border:0;background:var(--acc);color:#12100a;padding:9px 16px;border-radius:12px;font:700 14px 'Nunito',sans-serif;cursor:pointer;display:inline-block}
.btn.gh{background:var(--bg2);color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#chips{display:flex;gap:8px;padding:6px 16px 10px;overflow-x:auto}
.chip{border:1px solid var(--line);background:none;color:var(--ink);padding:5px 12px;border-radius:99px;font:600 13px 'Nunito',sans-serif;cursor:pointer;white-space:nowrap}
.chip i{font-style:normal;color:var(--mut);margin-left:4px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}.chip.on i{color:#fffc}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.em0{margin:auto;color:var(--mut)}
.sc{flex:1;position:relative;perspective:1800px;display:grid;place-items:center;min-height:0}
.sc::after{content:"";position:absolute;bottom:9%;width:56%;height:26px;background:radial-gradient(#000b,transparent 70%);filter:blur(8px)}
.tilt{transform-style:preserve-3d;transition:transform .3s ease-out;z-index:1}
.gw{position:absolute;inset:0}
/* defter */
.book{position:relative;width:min(92vw,860px,calc(64vh*1.4));aspect-ratio:1.4;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.lf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.lf.fl{transform:rotateY(-180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px 9px 9px 2px;overflow:hidden;box-shadow:1px 0 0 #d8ceb4,3px 1px 0 #c7bc9f}
.fc.bk{transform:rotateY(180deg);border-radius:9px 2px 2px 9px;box-shadow:-1px 0 0 #d8ceb4}
.cv{background:linear-gradient(115deg,#fff3 0,#0000 7%,#0004 100%),var(--cv);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#f3dfa6;box-shadow:inset 8px 0 12px #0006,4px 6px 0 #0003}
.stitch{position:absolute;inset:4%;border:2px dashed #f3dfa688;border-radius:5px}
.em{width:26%}.em svg{width:100%;fill:#f3dfa6;filter:drop-shadow(0 3px 0 #0007)}
.cv h2{font:400 clamp(20px,3.6vw,36px) 'Caveat',serif;text-align:center;padding:0 10%;position:relative}
.cv small{opacity:.7}
.pg{position:absolute;inset:0;padding:9% 9% 8%;color:#2b2118;background:#fbf6e6 repeating-linear-gradient(transparent 0 25px,#3a6ea522 25px 26px);box-shadow:inset 18px 0 18px -12px #0005;overflow:hidden}
.bk .pg{box-shadow:inset -18px 0 18px -12px #0005}
.pg small{font-weight:700;font-size:clamp(9px,1.3vw,12px)}
.pg h3{font:400 clamp(16px,2.5vw,26px)/1.1 'Caveat',serif;margin:4px 0 8px}
.pg p{font:500 clamp(14px,2vw,21px)/1.25 Caveat,cursive;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}
.pg .tg{margin-top:8px}.pg em{position:absolute;bottom:5%;right:9%;font:11px Caveat;color:#7a6a55}
.ix{display:flex;justify-content:space-between;gap:8px;font-size:clamp(11px,1.5vw,15px)!important;margin:2px 0}
.op{position:absolute;top:6%;right:8%;border:0;background:#0001;border-radius:8px;width:26px;height:26px;cursor:pointer;color:#2b2118}
.tg{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--mut)}.pg .tg{color:#7a6a55}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;padding:8px 16px 14px;position:relative;z-index:2}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--c);cursor:pointer}
.eb{width:32px;height:32px;background:var(--bg2);border:0;border-radius:8px;cursor:pointer;padding:6px}.eb svg{fill:var(--acc);width:100%}
#ct{background:var(--bg2);border:0;color:var(--ink);padding:8px 12px;border-radius:10px;width:140px;font:inherit}
/* kağıt / kartlar */
.pap{color:#2b2118;background:#fffaf0 repeating-linear-gradient(transparent 0 27px,#0000000d 27px 28px)}
.tc{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s}
/* zaman tüneli */
.tw{flex:1;position:relative;perspective:900px;perspective-origin:50% 35%;touch-action:none;overflow:hidden}
.floor{position:absolute;left:-20%;right:-20%;bottom:0;height:46%;transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%;background:repeating-linear-gradient(0deg,var(--line) 0 2px,transparent 2px 60px),repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 80px);opacity:.8;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.tn{position:absolute;inset:0;transform-style:preserve-3d}
.tcw{position:absolute;left:50%;top:46%;width:260px;margin:-85px 0 0 -130px;transform-style:preserve-3d}
.tcw .tc{padding:16px 18px;border-radius:4px;border-top:6px solid var(--c);box-shadow:0 20px 30px #0006;min-height:170px;cursor:pointer}
.tcw small{font-weight:700;color:var(--c)}.tcw h4{font:400 20px/1.15 'Caveat',serif}
.am{display:block;font:400 32px 'Caveat',serif;margin:8px 0 4px}.tcw span{font-size:12px;color:#7a6a55}
.pole{position:absolute;left:50%;bottom:100%;width:2px;height:80vh;background:linear-gradient(transparent,var(--acc))}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:var(--mut);font-size:13px;pointer-events:none}
/* ağ */
.ln{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.ln line{stroke:var(--mut);stroke-opacity:.55}
.nd{position:absolute;width:100px;text-align:center;transform:translate(-50%,-50%) translateZ(40px);cursor:grab;touch-action:none;user-select:none}
.nd i{display:grid;place-items:center;width:50px;height:50px;margin:auto;border-radius:50%;font-style:normal;font-size:22px;background:radial-gradient(circle at 30% 25%,#fff6,var(--c) 55%,#0007);box-shadow:0 12px 18px #0006;transition:scale .2s}
.nd:hover i{scale:1.18}.nd span{display:block;font-size:11px;line-height:1.2;margin-top:5px}
/* masa */
.cork{flex:1;margin:10px 14px 14px;border:12px solid #5a3a20;border-radius:16px;position:relative;overflow:auto;background:radial-gradient(#0003 1px,transparent 1.6px) 0 0/7px 7px,radial-gradient(#fff2 1px,transparent 1.6px) 3px 3px/9px 9px,#b78a58;box-shadow:inset 0 0 40px #0006,0 10px 30px #0005}
.nt{position:absolute;width:210px;min-height:150px;padding:20px 14px 12px;background:var(--p);color:#2b2118;border-radius:3px;box-shadow:0 10px 16px #0004;cursor:grab;touch-action:none;user-select:none;transition:scale .2s,box-shadow .2s}
.nt.up{scale:1.07;box-shadow:0 26px 34px #0006;cursor:grabbing}
.nt small{font-weight:700;color:var(--c)}.nt h4{font:400 19px/1.1 'Caveat',serif;margin:2px 0 4px}
.nt p{font:500 16px/1.2 Caveat,cursive;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pin{position:absolute;top:-8px;left:50%;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffa,var(--c) 45%,#0007);box-shadow:0 6px 6px #0005}
/* modal */
.ov{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:16px}
.mo{display:grid;grid-template-columns:1fr 1fr;gap:22px;background:var(--card);border-radius:20px;padding:22px;max-width:860px;width:100%;max-height:92vh;overflow:auto;position:relative}
@media(max-width:700px){.mo{grid-template-columns:1fr}}
.x{position:absolute;top:10px;right:12px;border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer;z-index:3}
.scan{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;perspective:900px;box-shadow:0 12px 28px #0005}
.scan img{width:100%;height:100%;object-fit:cover}
.fk{padding:12% 10%;font:500 20px/1.3 Caveat,cursive;filter:contrast(.9) blur(.25px);transform:rotate(-1.2deg);opacity:.85}
.ocr{position:absolute;inset:7%;background:#fffdf3f2;border-radius:10px;box-shadow:0 24px 50px #0007;opacity:0;transform:translateY(24px) rotateX(-12deg) scale(.94);pointer-events:none;transition:.55s cubic-bezier(.2,.8,.2,1)}
.ocr.on{opacity:1;transform:none;pointer-events:auto}
.ocr textarea{width:100%;height:100%;border:0;background:none;padding:14px;color:#2b2118;font:500 19px/1.3 Caveat,cursive;resize:none}
.sd{display:flex;flex-direction:column;gap:12px}.sd input:not([hidden]){background:var(--bg2);border:0;color:var(--ink);padding:10px 12px;border-radius:10px;font:400 24px 'Caveat',serif}
.sd small{font-weight:700}.mu{color:var(--mut);font-size:13px}.row{display:flex;gap:10px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* scrapbook katmanı */
.br{position:relative;background:#fff;color:#22303c;padding:0 22px;rotate:-2deg;box-shadow:0 6px 12px #0002;margin-top:6px}
.br b{font:700 44px/1.1 'Caveat',cursive}.br small{color:#5d6b78}
.tp{position:absolute;width:74px;height:22px;background:repeating-linear-gradient(-45deg,#fff8 0 5px,#fff3 5px 10px),var(--tc,#9fd0e6);box-shadow:0 1px 2px #0003;z-index:3}
.br .tp{top:-12px;left:50%;margin-left:-37px;rotate:3deg}
.pgw{flex:1;overflow:auto;width:100%;max-width:1100px;margin:0 auto;padding:8px 20px 60px}
.ttl{font:700 clamp(38px,6vw,56px)/1.1 'Caveat',cursive;margin:10px 0 6px}
.ttl span{background:linear-gradient(transparent 62%,var(--c,#bfd9f5) 62%);padding:0 6px}
.ttl small{font:600 15px 'Nunito',sans-serif;color:var(--mut);margin-left:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:40px 28px;padding:22px 4px}
.fd{position:relative;border:0;background:none;padding:0;aspect-ratio:1.25;rotate:var(--r);cursor:pointer;font:inherit;color:#22303c;text-align:left;transition:rotate .25s,translate .25s;animation:drop .5s calc(var(--i)*70ms) backwards cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{opacity:0;translate:0 -24px;rotate:0deg}}
.fd:hover{rotate:0deg;translate:0 -6px}
.fd::before{content:"";position:absolute;left:0;top:-16px;width:44%;height:24px;background:var(--c);border-radius:10px 10px 0 0}
.fd::after{content:"";position:absolute;inset:0;background:var(--c);border-radius:0 14px 14px 14px;box-shadow:0 10px 16px #0003}
.sh{position:absolute;z-index:1;left:7%;right:7%;top:8px;height:62%;rotate:-2.5deg;border-radius:3px;background:#fff repeating-linear-gradient(transparent 0 15px,#3a6ea526 15px 16px);box-shadow:0 1px 3px #0003}
.fr{position:absolute;z-index:2;left:0;right:0;bottom:0;height:66%;border-radius:10px 14px 14px 14px;background:linear-gradient(#fff6,#fff6),var(--c);box-shadow:0 -3px 8px #0002;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}
.fr em{font-style:normal;font-size:24px;line-height:1}
.fr b{font:700 34px/1 'Caveat',cursive}
.fr small{font-weight:600;font-size:13px;opacity:.75;color:#22303c}
.fd .tp{top:-14px;right:12%;rotate:7deg}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chips2 .chip.on{color:#22303c}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:36px 26px;padding:26px 4px;align-items:start}
.note{position:relative;background:#fff;color:#22303c;padding:28px 18px 16px;rotate:var(--r);box-shadow:0 8px 16px #0003;border-bottom:6px solid var(--c);cursor:pointer;transition:rotate .2s,translate .2s}
.note.ln{background:#fff repeating-linear-gradient(transparent 0 25px,#3a6ea520 25px 26px)}
.note:hover{rotate:0deg;translate:0 -5px}
.note:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.note .tp{top:-11px;left:50%;margin-left:-37px;rotate:-3deg}
.note time{font:500 21px 'Caveat',cursive;color:#5d6b78}
.note h3{font:800 17px/1.25 'Nunito',sans-serif;margin:2px 0 6px}
.note p{font:500 20px/1.15 'Caveat',cursive;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tgs span{background:var(--c);border-radius:99px;padding:0 9px;font-size:12px;font-weight:700}
.am{position:absolute;top:14px;right:12px;rotate:6deg;border:2px dashed #d0506b;color:#d0506b;padding:0 8px;font:700 13px 'Nunito',sans-serif;background:#fff}
@media(prefers-reduced-motion:reduce){.fd{animation:none}}

/* karşılama ekranı + tema + kurbağa */
.wl{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg) radial-gradient(var(--line) 1.2px,transparent 1.5px) 0 0/22px 22px;padding:14px clamp(16px,5vw,64px) 50px;transition:opacity .5s,translate .5s}
.wl.out{opacity:0;translate:0 -30px;pointer-events:none}
.wt{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.br{cursor:pointer}.mini{width:40px;height:36px;vertical-align:middle;margin-left:6px}
.th{display:flex;background:var(--bg2);padding:4px;border-radius:99px;gap:2px}
.th button{border:0;background:none;color:var(--mut);padding:6px 12px;border-radius:99px;font:700 13px 'Nunito',sans-serif;cursor:pointer;white-space:nowrap}
[data-theme=light] .th [data-th=light],[data-theme=dark] .th [data-th=dark]{background:var(--acc);color:#12100a}
.wm{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;max-width:1100px;margin:30px auto 0}
@media(max-width:760px){.wm{grid-template-columns:1fr}.fg{order:-1}}
.dt{letter-spacing:.14em;font:700 12px 'Nunito',sans-serif;color:var(--mut)}
.wh h1{font:700 clamp(48px,8vw,88px)/1 'Caveat',cursive;margin:8px 0}
.wh h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--acc) 62%);padding:0 8px}
.sb{color:var(--mut);font-size:17px;max-width:460px}
.ac{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.btn.big{padding:13px 24px;font-size:16px;box-shadow:0 5px 0 #0002}
.fg{position:relative;display:grid;place-items:center;padding-top:30px}
.frog{width:min(340px,72vw);aspect-ratio:200/180;overflow:visible;animation:hop 3s ease-in-out infinite}
@keyframes hop{50%{translate:0 -10px}}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
@keyframes bl{0%,94%,100%{scale:1}97%{scale:1 .1}}
.bub{position:absolute;top:0;right:2%;background:#fff;color:#22321f;padding:8px 14px;font:700 21px/1.1 'Caveat',cursive;rotate:4deg;box-shadow:0 6px 12px #0003;max-width:190px}
.bub .tp{top:-11px;left:40%;--tc:#b9e0c9}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:1100px;margin:34px auto 0;background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:16px 22px;rotate:-.4deg}
.ins small{color:var(--mut);font-weight:700}.ins b{display:block;font:700 42px/1 'Caveat',cursive}
.wl h2{max-width:1100px;margin:34px auto 0;font:700 34px 'Caveat',cursive}
.rc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px;max-width:1100px;margin:14px auto 0}
.rd{border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:var(--ink);transition:translate .2s}.rd:hover{translate:0 -5px}
.rd>div{background:var(--c);border-radius:14px;padding:22px 20px;box-shadow:0 8px 14px #0002}
.rp{position:relative;background:#fffaf0 repeating-linear-gradient(transparent 0 27px,#0000000d 27px 28px);color:#2b2118;padding:16px 14px;min-height:130px;rotate:var(--r);box-shadow:0 6px 10px #0003}
.rp small{font-weight:700;font-size:11px;color:#5f715a}.rp h4{font:700 24px/1 'Caveat',cursive;margin-top:6px}.rp .tp{top:-11px;left:50%;margin-left:-37px}
.rd b{display:block;margin-top:8px}.rd span{font-size:12px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){.frog,.eye{animation:none}}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></defs>
<symbol id="frog" viewBox="0 0 200 180"><g filter="url(#wob)" stroke="#2f5a2a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M22 150c-8 4-6 16 6 16 9 0 18-3 22-10M178 150c8 4 6 16-6 16-9 0-18-3-22-10" fill="#8fd07a"/>
<path d="M30 132C20 92 50 62 100 64c50-2 82 28 70 68-5 28-40 38-70 38s-65-10-70-38z" fill="#8fd07a"/>
<ellipse cx="100" cy="138" rx="44" ry="26" fill="#fff" stroke-width="3"/>
<circle cx="66" cy="60" r="27" fill="#8fd07a"/><circle cx="134" cy="60" r="27" fill="#8fd07a"/>
<g class="eye"><circle cx="66" cy="58" r="18" fill="#fff"/><circle cx="69" cy="60" r="7" fill="#2f5a2a" stroke="none"/></g>
<g class="eye"><circle cx="134" cy="58" r="18" fill="#fff"/><circle cx="131" cy="60" r="7" fill="#2f5a2a" stroke="none"/></g>
<path d="M76 108q24 22 48 0" fill="none"/>
<ellipse cx="54" cy="104" rx="8" ry="5" fill="#f6b8c4" stroke="none"/><ellipse cx="146" cy="104" rx="8" ry="5" fill="#f6b8c4" stroke="none"/>
<path d="M84 92l3 0M113 92l3 0" fill="none" stroke-width="3"/>
<circle cx="52" cy="140" r="4" fill="#6fb35a" stroke="none"/><circle cx="150" cy="128" r="5" fill="#6fb35a" stroke="none"/><circle cx="62" cy="152" r="3" fill="#6fb35a" stroke="none"/></g></symbol></svg>
<section class="wl" id="W"><div class="wt"><div class="br"><i class="tp"></i><b>Arşiv</b><small>akıllı dosyalama asistanı</small></div>
<div class="th" role="group" aria-label="Tema"><button data-th="light">☀ Açık</button><button data-th="dark">🌙 Koyu</button></div></div>
<div class="wm"><div class="wh"><p class="dt" id="dt"></p><h1>Arşivin, <em>canlı.</em></h1><p class="sb">Sakladığın her şey anlaşılmış ve güzelce düzenlenmiş.</p>
<div class="ac"><button class="btn big" data-in>Arşive gir →</button><button class="btn gh" data-in="new">＋ Belge ekle</button></div></div>
<div class="fg"><div class="bub"><i class="tp"></i>Hoş geldin! Belgelerine ben bakarım.</div><svg class="frog" viewBox="0 0 200 180" role="img" aria-label="Elle çizilmiş kurbağa maskot"><use href="#frog"/></svg></div></div>
<div class="ins"><div><small>Toplam belge</small><b id="s1"></b></div><div><small>Bağlı fikir (etiket)</small><b id="s2"></b></div><div><small>Klasör</small><b id="s3"></b></div></div>
<h2>Son eklenenler</h2><div class="rc" id="rc"></div></section>

<div id="chips"></div><main id="S"></main><div class="ov" id="M" hidden></div>
<script>
const CC={'Günlük':'#e2703a','Ders Notu':'#4f8cff','Fatura':'#d4a63c','Makbuz':'#3fb37f','Araştırma':'#b070e0'};
const IC={'Günlük':'📔','Ders Notu':'🎓','Fatura':'🧾','Makbuz':'💳','Araştırma':'🔬'};
const PC={'Günlük':'#fff3a8','Ders Notu':'#e6efff','Fatura':'#fffdf5','Makbuz':'#f1f1ea','Araştırma':'#ffffff'};
const TABS=[['klasor','🗂 Klasörler'],['defter','📔 3D Defter'],['zaman','🕰 Zaman Tüneli'],['ag','🕸 Bilgi Ağı'],['masa','📌 Çalışma Masası']];
const DEF={defter:['Günlük','Ders Notu'],zaman:['Fatura','Makbuz']};
const GO={'Günlük':'defter','Ders Notu':'defter','Fatura':'zaman','Makbuz':'zaman','Araştırma':'ag'};
let docs=[
{id:1,c:'Günlük',d:'2026-09-12',t:'Sahilde uzun bir yürüyüş',x:'Dersten sonra sahilde uzun uzun yürüdüm. Rüzgar, martılar, kulaklıkta eski şarkılar. Proje fikirleri yavaş yavaş netleşiyor.',g:['yürüyüş','proje','sahil']},
{id:2,c:'Günlük',d:'2026-09-18',t:'Prototip sonunda çalıştı',x:'Gece geç saatte sayfa çevirme animasyonu çalıştı. Küçük bir zafer ama çok keyifli. Yarın ışıkları ayarlayacağım.',g:['proje','animasyon','gece']},
{id:3,c:'Günlük',d:'2026-09-25',t:'Kütüphane sabahı',x:'Sabah erkenden kütüphaneye gidip kahve eşliğinde vize notlarını düzenledim. Sessizlik çok iyi geldi.',g:['kütüphane','vize','kahve']},
{id:4,c:'Ders Notu',d:'2026-09-08',t:'Veri yapıları: ağaçlar',x:'İkili arama ağaçlarında ekleme, silme ve dolaşma. AVL dengeleme ile en kötü durum O(log n) olur. Döndürme türlerine tekrar bak.',g:['algoritma','ağaç','vize']},
{id:5,c:'Ders Notu',d:'2026-09-15',t:'Yapay zeka: RAG mimarisi',x:'Belgeler parçalanır, gömülür, vektör veritabanında aranır; model yanıtı getirilen bağlamla üretir.',g:['yapay zeka','rag','proje']},
{id:6,c:'Ders Notu',d:'2026-09-22',t:'İşletim sistemleri: bellek',x:'Sayfalama, segmentasyon ve sanal bellek. Sayfa hatası oranı performansı doğrudan etkiler.',g:['bellek','vize','işletim']},
{id:7,c:'Fatura',d:'2026-07-05',t:'Elektrik faturası — Temmuz',x:'Dönem: Haziran. Son ödeme 15 Temmuz. Toplam tutar 842,50 ₺.',g:['elektrik','yaz'],m:'842,50 ₺'},
{id:8,c:'Fatura',d:'2026-08-04',t:'İnternet aboneliği',x:'Aylık fiber internet bedeli. KDV dahil 399,90 ₺.',g:['internet','abonelik'],m:'399,90 ₺'},
{id:9,c:'Fatura',d:'2026-09-03',t:'Cep telefonu faturası',x:'Eylül dönemi hat ücreti ve ek paket. Tutar 275,00 ₺.',g:['telefon','abonelik'],m:'275,00 ₺'},
{id:10,c:'Makbuz',d:'2026-07-20',t:'Kırtasiye makbuzu',x:'Defter, kalem ve dosya. Ödeme alındı: 186,00 ₺.',g:['kırtasiye','okul'],m:'186,00 ₺'},
{id:11,c:'Makbuz',d:'2026-09-10',t:'Kitap alışverişi fişi',x:'İki teknik kitap ve bir roman. Tahsil edilen: 512,75 ₺.',g:['kitap','okul'],m:'512,75 ₺'},
{id:12,c:'Araştırma',d:'2026-09-14',t:'Makale notu: LLM ile CV sıralama',x:'Büyük dil modelleri özgeçmişleri yeniden sıralamada anahtar kelime yöntemlerinden daha tutarlı sonuç veriyor.',g:['yapay zeka','rag','cv']},
{id:13,c:'Araştırma',d:'2026-09-20',t:'Vektör veritabanları karşılaştırması',x:'Gecikme, ölçeklenebilirlik ve filtreleme yetenekleri açısından üç vektör veritabanının karşılaştırması.',g:['rag','vektör','yapay zeka']}];
let view='klasor',tg='',folder='Tümü',cov={c:'#3b6fe0',e:0,t:'Günlüğüm'},pg=0,pgFn=null,loop=null,mv=0,dn=false,sx=0,sy=0;
const $=s=>document.querySelector(s),S=$('#S'),M=$('#M');
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt=d=>new Date(d).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
const list=()=>{const l=docs.slice().sort((a,b)=>a.d<b.d?-1:1);return folder!='Tümü'?l.filter(x=>x.c==folder):DEF[view]?l.filter(x=>DEF[view].includes(x.c)):l};
/* YAPAY ZEKA BAĞLANTI NOKTASI: sınıflandırma ve etiketleme şimdilik basit kural tabanlı */
function classify(t){const s=t.toLowerCase();for(const[c,re]of[['Fatura',/fatura|kdv|abonelik|son ödeme/],['Makbuz',/makbuz|fiş|tahsil|ödeme alındı/],['Ders Notu',/ders|vize|final|teorem|algoritma/],['Araştırma',/makale|araştırma|literatür|model/]])if(re.test(s))return c;return'Günlük'}
const autoTags=s=>[...new Set(s.toLowerCase().match(/[a-zçğıöşü]{6,}/g)||[])].slice(0,3);
const EM=[['.XX..XX.','XXXXXXXX','XXXXXXXX','XXXXXXXX','.XXXXXX.','..XXXX..','...XX...','........'],['...XX...','...XX...','XXXXXXXX','.XXXXXX.','..XXXX..','..XXXX..','.XX..XX.','XX....XX'],['..XXX...','.XX.....','XX......','XX......','XX......','XX......','.XX.....','..XXX...']];
const pix=e=>`<svg viewBox="0 0 8 8" shape-rendering="crispEdges">${EM[e].map((r,y)=>[...r].map((c,x)=>c=='X'?`<rect x="${x}" y="${y}" width="1" height="1"/>`:'').join('')).join('')}</svg>`;
(function f(){loop&&loop();requestAnimationFrame(f)})();
function render(){loop=null;pgFn=null;$('#chips').hidden=view=='klasor';
 $('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="${k==view?'on':''}" data-v="${k}">${n}</button>`).join('');
 $('#chips').innerHTML=['Tümü',...Object.keys(CC)].map(c=>`<button class="chip ${c==folder?'on':''}" data-f="${c}" style="--c:${CC[c]||'var(--acc)'}">${c=='Tümü'?'🗂':IC[c]} ${c}<i>${c=='Tümü'?docs.length:docs.filter(d=>d.c==c).length}</i></button>`).join('');
 if(!list().length){S.innerHTML='<p class="em0">Bu görünümde henüz belge yok. “Yeni belge” ile ekleyebilirsin.</p>';return}
 ({klasor,defter,zaman,ag,masa})[view]()}
/* ---- klasörler (scrapbook) ---- */
const FC={'Günlük':'#fbe39a','Ders Notu':'#bfd9f5','Fatura':'#f6c6d0','Makbuz':'#bfe6d3','Araştırma':'#d6ccf2'};
const PL={'Günlük':'Günlükler','Ders Notu':'Ders notları','Fatura':'Faturalar','Makbuz':'Makbuzlar','Araştırma':'Araştırmalar'};
const TP=['#9fd0e6','#f5b8c4','#f9e08a','#b9e0c9'],RT=[-2.2,1.6,-1,2.1,-1.6,1];
function klasor(){
 if(folder=='Tümü'){S.innerHTML=`<div class="pgw"><h2 class="ttl">Klasörler</h2><div class="grid">${Object.keys(CC).map((c,i)=>`<button class="fd" data-f="${c}" style="--c:${FC[c]};--r:${RT[i%6]}deg;--i:${i}"><i class="tp" style="--tc:${TP[i%4]}"></i><span class="sh"></span><span class="fr"><em>${IC[c]}</em><b>${PL[c]}</b><small>${docs.filter(d=>d.c==c).length} belge</small></span></button>`).join('')}</div></div>`;return}
 const all=docs.filter(d=>d.c==folder),tags=[...new Set(all.flatMap(d=>d.g))],L=all.filter(d=>!tg||d.g.includes(tg)).sort((a,b)=>a.d<b.d?1:-1),c=FC[folder];
 S.innerHTML=`<div class="pgw"><button class="btn gh" data-f="Tümü">‹ Klasörler</button><h2 class="ttl" style="--c:${c}"><span>${IC[folder]} ${PL[folder]}</span><small>${all.length} belge</small></h2><div class="chips2">${tags.map(t=>`<button class="chip${t==tg?' on':''}" data-t="${esc(t)}" style="--c:${c}">#${esc(t)}</button>`).join('')}</div><div class="notes">${L.map((d,i)=>`<div class="note${i%2?' ln':''}" role="button" tabindex="0" data-o="${d.id}" style="--c:${c};--r:${RT[(i+2)%6]}deg"><i class="tp" style="--tc:${TP[i%4]}"></i>${d.m?`<b class="am">${d.m}</b>`:''}<time>${fmt(d.d)}</time><h3>${esc(d.t)}</h3><p>${esc(d.x)}</p><div class="tgs">${d.g.map(t=>`<span>#${esc(t)}</span>`).join('')}</div></div>`).join('')}</div></div>`}
/* ---- 3D defter ---- */
function defter(){const L=list();
 const P=(d,n)=>d?`<div class="pg"><button class="op" data-o="${d.id}" aria-label="Belgeyi aç">⤢</button><small style="color:${CC[d.c]}">${d.c} · ${fmt(d.d)}</small><h3>${esc(d.t)}</h3><p>${esc(d.x)}</p><div class="tg">${d.g.map(t=>`<span>#${esc(t)}</span>`).join('')}</div><em>${n}</em></div>`:'<div class="pg"></div>';
 let lv=`<div class="lf"><div class="fc cv" style="--cv:${cov.c}"><div class="stitch"></div><div class="em">${pix(cov.e)}</div><h2>${esc(cov.t)}</h2><small>${L.length} sayfa</small></div><div class="fc bk"><div class="pg"><h3>İçindekiler</h3>${L.map((d,i)=>`<p class="ix"><span>${esc(d.t)}</span><b>${i+1}</b></p>`).join('')}</div></div></div>`;
 for(let i=0;i<L.length;i+=2)lv+=`<div class="lf"><div class="fc">${P(L[i],i+1)}</div><div class="fc bk">${P(L[i+1],i+2)}</div></div>`;
 S.innerHTML=`<div class="sc"><div class="tilt"><div class="book">${lv}</div></div></div><div class="bar"><button class="btn gh" data-p="-1">‹ Önceki</button>${['#3b6fe0','#2f9e7a','#d9607a','#7a5cc7','#22303c'].map(c=>`<button class="sw" data-cc="${c}" style="--c:${c}" aria-label="Kapak rengi"></button>`).join('')}${EM.map((_,i)=>`<button class="eb" data-ce="${i}" aria-label="Kapak simgesi">${pix(i)}</button>`).join('')}<input id="ct" value="${esc(cov.t)}" maxlength="22" aria-label="Kapak başlığı"><button class="btn gh" data-p="1">Sonraki ›</button></div>`;
 const lf=[...S.querySelectorAll('.lf')],N=lf.length,bk=S.querySelector('.book');
 pgFn=n=>{pg=Math.max(0,Math.min(N,n));lf.forEach((l,i)=>{l.classList.toggle('fl',i<pg);l.style.zIndex=i<pg?i:N-i});bk.style.transform=`translateX(${pg==0?-25:pg==N?25:0}%)`};
 lf.forEach((l,i)=>l.onclick=e=>{if(e.target.closest('.op'))return;pgFn(l.classList.contains('fl')?i:i+1)});
 pgFn(pg);
 $('#ct').oninput=e=>{cov.t=e.target.value;S.querySelector('.cv h2').textContent=cov.t}}
/* ---- zaman tüneli ---- */
function zaman(){const L=list().reverse(),G=420;
 S.innerHTML=`<div class="tw"><div class="floor"></div><div class="tn">${L.map(d=>`<div class="tcw"><div class="pole"></div><div class="tc pap" data-o="${d.id}" style="--c:${CC[d.c]}"><small>${d.c}</small><b class="am">${d.m||''}</b><h4>${esc(d.t)}</h4><span>${fmt(d.d)}</span></div></div>`).join('')}</div><div class="hint">Kaydır ya da sürükle — zamanda geriye git</div></div>`;
 const w=S.firstChild,cs=[...w.querySelectorAll('.tcw')],fl=w.querySelector('.floor'),max=Math.max(0,(L.length-1)*G);let cam=0,tg=0,ly=null;
 const go=v=>tg=Math.min(max,Math.max(0,v));
 w.onwheel=e=>{e.preventDefault();go(tg+e.deltaY*1.2)};
 w.onpointerdown=e=>ly=e.clientY;w.onpointerup=()=>ly=null;
 w.onpointermove=e=>{const r=w.getBoundingClientRect();w.style.perspectiveOrigin=`${50+((e.clientX-r.left)/r.width-.5)*30}% ${35+((e.clientY-r.top)/r.height-.5)*20}%`;if(ly!=null&&e.buttons){go(tg+(ly-e.clientY)*2.2);ly=e.clientY}};
 loop=()=>{cam+=(tg-cam)*.08;const nar=w.clientWidth<600;cs.forEach((c,i)=>{const z=cam-i*G;c.style.transform=`translate3d(${(i%2?1:-1)*(nar?50:240)}px,${(i%3-1)*36}px,${z}px) rotateY(${i%2?-15:15}deg)`;c.style.opacity=z>260?0:Math.max(0,1+z/2600);c.style.pointerEvents=z>180?'none':''});fl.style.backgroundPosition=`0 ${cam*.5}px`}}
/* ---- bilgi ağı ---- */
function ag(){const L=list(),E=[];
 L.forEach((a,i)=>L.forEach((b,j)=>{if(j>i){const k=a.g.filter(t=>b.g.includes(t)).length;if(k)E.push([i,j,k])}}));
 S.innerHTML=`<div class="sc"><div class="tilt gw"><svg class="ln">${E.map(([,,k])=>`<line stroke-width="${k*1.6}"/>`).join('')}</svg>${L.map((d,i)=>`<div class="nd" data-o="${d.id}" data-i="${i}" style="--c:${CC[d.c]}"><i>${IC[d.c]}</i><span>${esc(d.t)}</span></div>`).join('')}</div></div>`;
 const gw=S.querySelector('.gw'),N=[...gw.querySelectorAll('.nd')],Ls=[...gw.querySelectorAll('line')];
 const W=gw.clientWidth||600,H=gw.clientHeight||400,P=L.map((_,i)=>({x:W/2+Math.cos(i*2.4)*(60+i*14),y:H/2+Math.sin(i*2.4)*(50+i*9),vx:0,vy:0}));
 let cur=null,lx,ly;
 gw.onpointerdown=e=>{const n=e.target.closest('.nd');if(!n)return;cur=P[n.dataset.i];cur.f=1;lx=e.clientX;ly=e.clientY};
 gw.onpointermove=e=>{if(!cur)return;cur.x+=e.clientX-lx;cur.y+=e.clientY-ly;lx=e.clientX;ly=e.clientY};
 window.onpointerup=()=>{if(cur){cur.f=0;cur=null}};
 loop=()=>{const w=gw.clientWidth,h=gw.clientHeight;
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1,f=14000/(d*d);dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
  E.forEach(([i,j,k])=>{const a=P[i],b=P[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-150)*.012*k;dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f});
  P.forEach((p,i)=>{p.vx+=(w/2-p.x)*.003;p.vy+=(h/2-p.y)*.003;if(!p.f){p.x=Math.min(w-50,Math.max(50,p.x+p.vx));p.y=Math.min(h-40,Math.max(40,p.y+p.vy))}p.vx*=.8;p.vy*=.8;N[i].style.left=p.x+'px';N[i].style.top=p.y+'px'});
  E.forEach(([i,j],k)=>{const l=Ls[k];l.setAttribute('x1',P[i].x);l.setAttribute('y1',P[i].y);l.setAttribute('x2',P[j].x);l.setAttribute('y2',P[j].y)})}}
/* ---- çalışma masası ---- */
function masa(){const L=list(),cols=Math.max(2,Math.floor(S.clientWidth/230));
 L.forEach((d,i)=>{if(d.px==null){d.px=20+(i%cols)*225+Math.sin(d.id)*14;d.py=26+Math.floor(i/cols)*200+Math.cos(d.id)*10;d.pr=Math.sin(d.id*3)*6}});
 S.innerHTML=`<div class="cork">${L.map(d=>`<div class="tc nt" data-o="${d.id}" style="left:${d.px}px;top:${d.py}px;rotate:${d.pr}deg;--p:${PC[d.c]};--c:${CC[d.c]}"><i class="pin"></i><small>${d.c}</small><h4>${esc(d.t)}</h4><p>${esc(d.x)}</p></div>`).join('')}</div>`;
 const ck=S.firstChild;let cur=null,z=5;
 ck.onpointerdown=e=>{const c=e.target.closest('.nt');if(!c)return;cur={c,d:docs.find(x=>x.id==c.dataset.o),ox:e.clientX-c.offsetLeft,oy:e.clientY-c.offsetTop};c.style.zIndex=++z;c.classList.add('up')};
 ck.onpointermove=e=>{if(!cur)return;const{c,d}=cur;c.style.left=(d.px=Math.max(0,e.clientX-cur.ox))+'px';c.style.top=(d.py=Math.max(0,e.clientY-cur.oy))+'px';c.style.rotate=(d.pr+Math.max(-9,Math.min(9,(e.movementX||0)*.6)))+'deg'};
 window.onpointerup=()=>{if(cur){cur.c.classList.remove('up');cur.c.style.rotate=cur.d.pr+'deg';cur=null}}}
/* ---- belge penceresi: orijinal görsel + düzenlenebilir metin katmanı ---- */
function openDoc(id){const nw=!id,d=nw?{t:'',x:'',g:[],c:''}:docs.find(x=>x.id==id);let img=d.img||'';
 M.hidden=false;
 M.innerHTML=`<div class="mo"><button class="x" data-x aria-label="Kapat">✕</button><div class="scan pap">${img?`<img src="${img}" alt="">`:`<div class="fk">${nw?'Henüz görsel yok. Aşağıdan yükle ya da metni yaz.':esc(d.x)}</div>`}<div class="ocr${nw?' on':''}" id="oc"><textarea id="tx" placeholder="Metni yaz ya da yapıştır…">${esc(d.x)}</textarea></div></div><div class="sd"><small style="color:${CC[d.c]||'var(--mut)'}">${d.c||'Kategori otomatik seçilecek'}</small><input id="ti" value="${esc(d.t)}" placeholder="Başlık"><p class="mu">${nw?'':fmt(d.d)}</p><div class="tg">${d.g.map(t=>`<span>#${esc(t)}</span>`).join('')}</div><label class="btn gh">📷 Görsel yükle<input type="file" id="fi" accept="image/*" hidden></label><div class="row"><button class="btn gh" id="ed">✎ Metni düzenle</button><button class="btn" id="sv">Kaydet</button></div><p class="mu">Metin çıkarma (OCR) ve etiketleme şimdilik örnek kural tabanlı; yapay zeka bağlanınca gerçek sonuçlar gelecek.</p></div></div>`;
 $('#ed').onclick=()=>$('#oc').classList.toggle('on');
 $('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{img=r.result;const s=M.querySelector('.scan');s.querySelector('.fk,img')?.remove();s.insertAdjacentHTML('afterbegin',`<img src="${img}" alt="">`)};r.readAsDataURL(f)};
 $('#sv').onclick=()=>{let x=$('#tx').value.trim();const t=$('#ti').value.trim()||x.slice(0,32)||'Adsız belge';
  if(!x&&img)x='(Görselden çıkarılan metin burada görünecek — OCR entegrasyonu bekleniyor)';
  if(nw){const c=classify(x+' '+t);docs.push({id:Date.now(),c,d:new Date().toISOString().slice(0,10),t,x,g:autoTags(x+' '+t),img,m:(x.match(/[\d.]+,\d{2}\s?(₺|TL)/)||[])[0]});view='klasor';folder=c;tg='';pg=0}
  else{if(x!=d.x)d.g=autoTags(x+' '+t);Object.assign(d,{t,x,img})}
  M.hidden=true;render()}}
/* ---- olaylar ---- */
document.addEventListener('click',e=>{const t=e.target,q=s=>t.closest(s);let b;
 if(b=q('[data-v]')){view=b.dataset.v;folder='Tümü';render()}
 else if(b=q('[data-f]')){folder=b.dataset.f;tg='';render()}
 else if(b=q('[data-t]')){tg=tg==b.dataset.t?'':b.dataset.t;render()}
 else if(b=q('[data-cc]')){cov.c=b.dataset.cc;S.querySelector('.cv').style.setProperty('--cv',cov.c)}
 else if(b=q('[data-ce]')){cov.e=+b.dataset.ce;S.querySelector('.em').innerHTML=pix(cov.e)}
 else if(b=q('[data-p]')){pgFn&&pgFn(pg+ +b.dataset.p)}
 else if(b=q('[data-o]')){if(mv<6)openDoc(+b.dataset.o)}
 else if(q('[data-x]')||t==M)M.hidden=true;
 else if(q('#add'))openDoc()});
document.addEventListener('pointerdown',e=>{dn=true;mv=0;sx=e.clientX;sy=e.clientY});
document.addEventListener('pointerup',()=>dn=false);
document.addEventListener('pointermove',e=>{if(dn)mv=Math.max(mv,Math.hypot(e.clientX-sx,e.clientY-sy));
 const sc=e.target.closest('.sc');if(sc){const r=sc.getBoundingClientRect();sc.firstElementChild.style.transform=`rotateY(${((e.clientX-r.left)/r.width-.5)*16}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*10}deg)`}
 const c=e.target.closest('.tc');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*20+'deg');c.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*20+'deg')}});
document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.tc');if(c&&!c.contains(e.relatedTarget)){c.style.removeProperty('--rx');c.style.removeProperty('--ry')}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')M.hidden=true;if(e.key=='Enter'&&e.target.dataset&&e.target.dataset.o)openDoc(+e.target.dataset.o)});
render();
/* ---- karşılama + tema ---- */
const W=$('#W'),setTh=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}};
let _t;try{_t=localStorage.getItem('th')}catch(e){}
setTh(_t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
function fillW(){$('#dt').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toLocaleUpperCase('tr-TR');
 $('#s1').textContent=docs.length;$('#s2').textContent=new Set(docs.flatMap(d=>d.g)).size;$('#s3').textContent=new Set(docs.map(d=>d.c)).size;
 $('#rc').innerHTML=docs.slice().sort((a,b)=>a.d<b.d?1:-1).slice(0,4).map((d,i)=>`<button class="rd" data-r="${d.id}"><div style="--c:${FC[d.c]||'#e3eedb'}"><div class="rp" style="--r:${RT[i%6]}deg"><i class="tp" style="--tc:${TP[i%4]}"></i><small>${IC[d.c]||''} ${esc(d.c)}</small><h4>${esc(d.t)}</h4></div></div><b>${esc(d.t)}</b><span>${esc(d.c)} · ${fmt(d.d)}</span></button>`).join('')}
function enter(cb){W.classList.add('out');setTimeout(()=>{W.hidden=true;cb&&cb()},450)}
document.addEventListener('click',e=>{const t=e.target;let b;
 if(b=t.closest('[data-th]'))setTh(b.dataset.th);
 else if(b=t.closest('[data-in]'))enter(b.dataset.in=='new'?()=>openDoc():null);
 else if(b=t.closest('[data-r]'))enter(()=>openDoc(+b.dataset.r));
 else if(t.closest('.br')&&W.hidden){fillW();W.hidden=false;requestAnimationFrame(()=>W.classList.remove('out'))}});
fillW();
</script></body></html>
